name: Sync projects

# Regenerates data/projects.js from the public repositories of every profile
# listed in data/categories.json, so a new repository shows up on the page
# without anyone touching this one.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/categories.json"
      - "data/overrides.json"
      - "scripts/sync-projects.py"
      - ".github/workflows/sync-projects.yml"

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-projects.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data/projects.js)" ]; then
            echo "No change — the project list is already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.js
          git commit -m "Sync projects from GitHub"
          git push
