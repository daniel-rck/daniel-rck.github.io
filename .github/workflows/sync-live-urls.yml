name: Sync live URLs

# Keeps data/live.js in step with the "About > Website" field of every
# repository listed in data/projects.js, so a live URL only ever has to be
# set in one place: on the repository itself.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/projects.js"
      - "scripts/sync-live-urls.py"
      - ".github/workflows/sync-live-urls.yml"

permissions:
  contents: write

concurrency:
  group: sync-live-urls
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read repository homepages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-live-urls.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data/live.js)" ]; then
            echo "No change — live URLs are already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.js
          git commit -m "Sync live URLs from repository homepages"
          git push
